<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Ilustración: factura con sello de pagada sobre un gráfico de crecimiento">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6a14a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d6a14a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.78" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#d6a14a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#d6a14a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rejilla" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22303a" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="520" fill="#0a0f14"/>
  <rect width="1200" height="520" fill="url(#rejilla)"/>
  <rect width="1200" height="520" fill="url(#brillo)"/>

  <!-- Columnas de un gráfico de barras -->
  <g fill="#111820" stroke="#22303a">
    <rect x="80" y="400" width="30" height="120"/>
    <rect x="140" y="370" width="30" height="150"/>
    <rect x="200" y="385" width="30" height="135"/>
    <rect x="260" y="330" width="30" height="190"/>
    <rect x="320" y="345" width="30" height="175"/>
    <rect x="380" y="290" width="30" height="230"/>
    <rect x="440" y="260" width="30" height="260"/>
  </g>
  <rect x="440" y="260" width="30" height="260" fill="#d6a14a" opacity="0.18"/>

  <!-- Línea de crecimiento -->
  <path d="M40 460 L180 420 L300 438 L420 360 L540 378 L660 290 L800 250 L940 170 L1080 120 L1160 96 L1200 84 L1200 520 L40 520 Z" fill="url(#area)"/>
  <path d="M40 460 L180 420 L300 438 L420 360 L540 378 L660 290 L800 250 L940 170 L1080 120 L1160 96 L1200 84" fill="none" stroke="#d6a14a" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#0a0f14" stroke="#d6a14a" stroke-width="2">
    <circle cx="180" cy="420" r="5"/>
    <circle cx="420" cy="360" r="5"/>
    <circle cx="660" cy="290" r="5"/>
  </g>
  <circle cx="1160" cy="96" r="18" fill="#d6a14a" opacity="0.15"/>
  <circle cx="1160" cy="96" r="7" fill="#d6a14a"/>

  <!-- Factura de atrás -->
  <g transform="rotate(-9 760 280)" opacity="0.9">
    <rect x="620" y="80" width="290" height="370" fill="#0d141b" stroke="#22303a"/>
  </g>

  <!-- Factura principal -->
  <g transform="rotate(-3 800 270)" filter="url(#sombra)">
    <rect x="660" y="60" width="300" height="390" fill="#111820" stroke="#22303a"/>
    <!-- Franja dorada superior -->
    <rect x="660" y="60" width="300" height="4" fill="#d6a14a"/>
    <!-- Cabecera -->
    <rect x="692" y="96" width="110" height="14" fill="#eef1f3" opacity="0.9"/>
    <rect x="692" y="120" width="70" height="6" fill="#9aa8b3" opacity="0.6"/>
    <rect x="848" y="96" width="80" height="6" fill="#9aa8b3" opacity="0.6"/>
    <rect x="868" y="110" width="60" height="6" fill="#9aa8b3" opacity="0.6"/>
    <!-- Tabla de líneas -->
    <g fill="#22303a">
      <rect x="692" y="160" width="236" height="1"/>
      <rect x="692" y="196" width="236" height="1"/>
      <rect x="692" y="232" width="236" height="1"/>
      <rect x="692" y="268" width="236" height="1"/>
      <rect x="692" y="304" width="236" height="1"/>
    </g>
    <g fill="#9aa8b3" opacity="0.55">
      <rect x="692" y="174" width="120" height="7"/>
      <rect x="888" y="174" width="40" height="7"/>
      <rect x="692" y="210" width="96" height="7"/>
      <rect x="896" y="210" width="32" height="7"/>
      <rect x="692" y="246" width="136" height="7"/>
      <rect x="884" y="246" width="44" height="7"/>
      <rect x="692" y="282" width="84" height="7"/>
      <rect x="892" y="282" width="36" height="7"/>
    </g>
    <!-- Totales -->
    <rect x="828" y="330" width="56" height="6" fill="#9aa8b3" opacity="0.55"/>
    <rect x="896" y="330" width="32" height="6" fill="#9aa8b3" opacity="0.55"/>
    <rect x="828" y="348" width="40" height="6" fill="#9aa8b3" opacity="0.55"/>
    <rect x="900" y="348" width="28" height="6" fill="#9aa8b3" opacity="0.55"/>
    <rect x="828" y="372" width="100" height="16" fill="#d6a14a"/>
    <!-- Sello de pagada -->
    <g transform="translate(736 380)">
      <circle r="34" fill="none" stroke="#d6a14a" stroke-width="2"/>
      <circle r="27" fill="none" stroke="#d6a14a" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>
      <path d="M-12 1 L-3 10 L14 -9" fill="none" stroke="#d6a14a" stroke-width="3" stroke-linecap="square"/>
    </g>
  </g>

  <!-- Detalles: marcas de medida como en la web -->
  <g fill="#d6a14a">
    <rect x="40" y="40" width="24" height="2"/>
    <rect x="40" y="40" width="2" height="24"/>
    <rect x="1136" y="478" width="24" height="2"/>
    <rect x="1158" y="456" width="2" height="24"/>
  </g>
</svg>
